global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: mysql
    static_configs:
      - targets:
          - mysqld-exporter:9104

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: spring-boot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8080
        labels:
          application: coupon-toy-project
